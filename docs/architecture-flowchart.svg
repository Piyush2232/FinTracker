<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 780" width="1120" height="780" font-family="Plus Jakarta Sans, Inter, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8.5 5 L 0 8.5 z" fill="#121316" />
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8.5 5 L 0 8.5 z" fill="#159A49" />
    </marker>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8.5 5 L 0 8.5 z" fill="#C83232" />
    </marker>
    <filter id="card-shadow" x="-2%" y="-4%" width="104%" height="110%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#121316" flood-opacity="0.04" />
    </filter>
  </defs>

  <!-- Canvas Background -->
  <rect width="1120" height="780" rx="24" fill="#F9F9FC" stroke="#E2E4E7" stroke-width="1.5" />

  <!-- Header Banner -->
  <text x="44" y="52" font-size="22" font-weight="700" fill="#121316" letter-spacing="-0.4">FinTracker — Zero-Cloud On-Device System Architecture</text>
  <text x="44" y="76" font-size="13" font-weight="500" fill="#66686D">100% Local Processing Pipeline • No INTERNET Permission • Sub-Millisecond ML Classification (&lt; 0.25 ms)</text>

  <!-- Zero-Cloud Pill Badge -->
  <rect x="858" y="34" width="218" height="34" rx="17" fill="#EEF7F1" stroke="#159A49" stroke-width="1.2" />
  <circle cx="878" cy="51" r="5" fill="#159A49" />
  <text x="892" y="56" font-size="12" font-weight="700" fill="#159A49">ZERO CLOUD • 100% LOCAL</text>

  <!-- LAYER 1: CAPTURE & INGESTION -->
  <rect x="44" y="106" width="1032" height="128" rx="18" fill="#FFFFFF" stroke="#E2E4E7" stroke-width="1.5" filter="url(#card-shadow)" />
  <rect x="62" y="120" width="28" height="22" rx="6" fill="#121316" />
  <text x="76" y="135" text-anchor="middle" font-size="11" font-weight="700" fill="#FFFFFF">01</text>
  <text x="100" y="136" font-size="13" font-weight="700" fill="#121316" letter-spacing="0.6">ON-DEVICE CAPTURE &amp; INGESTION LAYER</text>

  <!-- Layer 1 Nodes -->
  <rect x="62" y="154" width="184" height="62" rx="12" fill="#F3F5F7" stroke="#E2E4E7" stroke-width="1" />
  <text x="154" y="180" text-anchor="middle" font-size="12" font-weight="700" fill="#181A1C">SmsContentObserverService</text>
  <text x="154" y="198" text-anchor="middle" font-size="10.5" fill="#66686D">Watches content://sms</text>

  <rect x="264" y="154" width="184" height="62" rx="12" fill="#F3F5F7" stroke="#E2E4E7" stroke-width="1" />
  <text x="356" y="180" text-anchor="middle" font-size="12" font-weight="700" fill="#181A1C">SmsBroadcastReceiver</text>
  <text x="356" y="198" text-anchor="middle" font-size="10.5" fill="#66686D">Live SMS_RECEIVED Intent</text>

  <rect x="466" y="154" width="184" height="62" rx="12" fill="#F3F5F7" stroke="#E2E4E7" stroke-width="1" />
  <text x="558" y="180" text-anchor="middle" font-size="12" font-weight="700" fill="#181A1C">SmsInboxScanner</text>
  <text x="558" y="198" text-anchor="middle" font-size="10.5" fill="#66686D">ContentResolver Sync</text>

  <rect x="668" y="154" width="204" height="62" rx="12" fill="#F3F5F7" stroke="#E2E4E7" stroke-width="1" />
  <text x="770" y="180" text-anchor="middle" font-size="12" font-weight="700" fill="#181A1C">PaymentNotificationListener</text>
  <text x="770" y="198" text-anchor="middle" font-size="10.5" fill="#66686D">GPay, PhonePe, Paytm, UPI Lite</text>

  <rect x="890" y="154" width="168" height="62" rx="12" fill="#F3F5F7" stroke="#E2E4E7" stroke-width="1" />
  <text x="974" y="180" text-anchor="middle" font-size="12" font-weight="700" fill="#181A1C">CSV &amp; Tester Ingestion</text>
  <text x="974" y="198" text-anchor="middle" font-size="10.5" fill="#66686D">Statement &amp; Batch Stream</text>

  <!-- Connector Arrows Layer 1 -> Layer 2 -->
  <line x1="460" y1="234" x2="460" y2="266" stroke="#121316" stroke-width="1.8" marker-end="url(#arrow)" />

  <!-- LAYER 2: DETERMINISTIC REGEX & SEMANTIC PARSER -->
  <rect x="44" y="272" width="1032" height="148" rx="18" fill="#FFFFFF" stroke="#E2E4E7" stroke-width="1.5" filter="url(#card-shadow)" />
  <rect x="62" y="286" width="28" height="22" rx="6" fill="#121316" />
  <text x="76" y="301" text-anchor="middle" font-size="11" font-weight="700" fill="#FFFFFF">02</text>
  <text x="100" y="302" font-size="13" font-weight="700" fill="#121316" letter-spacing="0.6">DETERMINISTIC INDIAN FINANCIAL REGEX &amp; SPAM GATE</text>

  <rect x="62" y="322" width="212" height="78" rx="12" fill="#F3F5F7" stroke="#E2E4E7" stroke-width="1" />
  <text x="168" y="348" text-anchor="middle" font-size="12.5" font-weight="700" fill="#181A1C">TRAI DLT Header Check</text>
  <text x="168" y="366" text-anchor="middle" font-size="10.5" fill="#66686D">Validates AD-HDFCBK, VM-ICICIB</text>
  <text x="168" y="382" text-anchor="middle" font-size="10.5" fill="#66686D">JD-SBIUPI commercial senders</text>

  <line x1="274" y1="361" x2="306" y2="361" stroke="#121316" stroke-width="1.6" marker-end="url(#arrow)" />

  <rect x="312" y="322" width="218" height="78" rx="12" fill="#F3F5F7" stroke="#E2E4E7" stroke-width="1" />
  <text x="421" y="348" text-anchor="middle" font-size="12.5" font-weight="700" fill="#181A1C">Spam &amp; Non-Expense Gate</text>
  <text x="421" y="366" text-anchor="middle" font-size="10.5" fill="#66686D">Blocks OTPs, Loan Promos,</text>
  <text x="421" y="382" text-anchor="middle" font-size="10.5" fill="#66686D">UPI Lite Top-Ups &amp; Failed Txns</text>

  <!-- Blocked Exit Branch -->
  <path d="M 421 400 L 421 434 L 154 434 L 154 452" fill="none" stroke="#C83232" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#arrow-red)" />
  <rect x="62" y="458" width="184" height="54" rx="12" fill="#FDF2F2" stroke="#C83232" stroke-width="1.2" />
  <text x="154" y="482" text-anchor="middle" font-size="12" font-weight="700" fill="#C83232">Blocked &amp; Discarded</text>
  <text x="154" y="498" text-anchor="middle" font-size="10.5" fill="#932020">Zero DB writes • Counter++</text>

  <line x1="530" y1="361" x2="562" y2="361" stroke="#121316" stroke-width="1.6" marker-end="url(#arrow)" />

  <rect x="568" y="322" width="224" height="78" rx="12" fill="#F3F5F7" stroke="#E2E4E7" stroke-width="1" />
  <text x="680" y="348" text-anchor="middle" font-size="12.5" font-weight="700" fill="#181A1C">Clause Semantic Scoping</text>
  <text x="680" y="366" text-anchor="middle" font-size="10.5" fill="#66686D">Splits compound clauses (; / .)</text>
  <text x="680" y="382" text-anchor="middle" font-size="10.5" fill="#66686D">Isolates Debit vs Avl Bal / Credit</text>

  <line x1="792" y1="361" x2="824" y2="361" stroke="#121316" stroke-width="1.6" marker-end="url(#arrow)" />

  <rect x="830" y="322" width="228" height="78" rx="12" fill="#F3F5F7" stroke="#E2E4E7" stroke-width="1" />
  <text x="944" y="348" text-anchor="middle" font-size="12.5" font-weight="700" fill="#181A1C">IndianSmsRegexParser</text>
  <text x="944" y="366" text-anchor="middle" font-size="10.5" fill="#66686D">7 Merchant/VPA Rules • ₹/INR/Rs</text>
  <text x="944" y="382" text-anchor="middle" font-size="10.5" fill="#66686D">Card/Ac Mask &amp; UPI Ref Extractor</text>

  <!-- Connector Layer 2 -> Layer 3 -->
  <line x1="944" y1="400" x2="944" y2="452" stroke="#121316" stroke-width="1.8" marker-end="url(#arrow)" />

  <!-- LAYER 3: ON-DEVICE ML ENGINE -->
  <rect x="272" y="458" width="804" height="142" rx="18" fill="#FFFFFF" stroke="#159A49" stroke-width="1.5" filter="url(#card-shadow)" />
  <rect x="290" y="472" width="28" height="22" rx="6" fill="#159A49" />
  <text x="304" y="487" text-anchor="middle" font-size="11" font-weight="700" fill="#FFFFFF">03</text>
  <text x="328" y="488" font-size="13" font-weight="700" fill="#159A49" letter-spacing="0.6">OFFLINE SUBWORD N-GRAM &amp; NAIVE BAYES ML ENGINE (&lt; 0.25 ms)</text>

  <rect x="290" y="508" width="236" height="74" rx="12" fill="#EEF7F1" stroke="#B7E2C6" stroke-width="1" />
  <text x="408" y="534" text-anchor="middle" font-size="12.5" font-weight="700" fill="#121316">VPA &amp; Token Normalizer</text>
  <text x="408" y="552" text-anchor="middle" font-size="10.5" fill="#46464B">Strips @okaxis, @ybl, @oksbi</text>
  <text x="408" y="568" text-anchor="middle" font-size="10.5" fill="#46464B">Extracts compound bigrams</text>

  <line x1="526" y1="545" x2="558" y2="545" stroke="#159A49" stroke-width="1.6" marker-end="url(#arrow-green)" />

  <rect x="564" y="508" width="246" height="74" rx="12" fill="#EEF7F1" stroke="#B7E2C6" stroke-width="1" />
  <text x="687" y="534" text-anchor="middle" font-size="12.5" font-weight="700" fill="#121316">DiasporaMlClassifier</text>
  <text x="687" y="552" text-anchor="middle" font-size="10.5" fill="#46464B">300+ Priors + 3-Gram Jaccard</text>
  <text x="687" y="568" text-anchor="middle" font-size="10.5" fill="#46464B">Predicts 8 Expense Categories</text>

  <line x1="810" y1="545" x2="842" y2="545" stroke="#159A49" stroke-width="1.6" marker-end="url(#arrow-green)" />

  <rect x="848" y="508" width="210" height="74" rx="12" fill="#EEF7F1" stroke="#B7E2C6" stroke-width="1" />
  <text x="953" y="534" text-anchor="middle" font-size="12.5" font-weight="700" fill="#121316">Online Weight Learner</text>
  <text x="953" y="552" text-anchor="middle" font-size="10.5" fill="#46464B">Reinforces token priors in</text>
  <text x="953" y="568" text-anchor="middle" font-size="10.5" fill="#46464B">Room ml_token_weights</text>

  <!-- Connector Layer 3 -> Layer 4 -->
  <line x1="687" y1="600" x2="687" y2="632" stroke="#121316" stroke-width="1.8" marker-end="url(#arrow)" />

  <!-- LAYER 4: DEDUP, LOCAL STORAGE & EXPORTS -->
  <rect x="44" y="638" width="1032" height="114" rx="18" fill="#FFFFFF" stroke="#E2E4E7" stroke-width="1.5" filter="url(#card-shadow)" />
  <rect x="62" y="652" width="28" height="22" rx="6" fill="#121316" />
  <text x="76" y="667" text-anchor="middle" font-size="11" font-weight="700" fill="#FFFFFF">04</text>
  <text x="100" y="668" font-size="13" font-weight="700" fill="#121316" letter-spacing="0.6">CROSS-CHANNEL DEDUPLICATION, LOCAL SQLITE &amp; DOCUMENT EXPORT</text>

  <rect x="62" y="684" width="246" height="52" rx="12" fill="#F3F5F7" stroke="#E2E4E7" stroke-width="1" />
  <text x="185" y="707" text-anchor="middle" font-size="12" font-weight="700" fill="#181A1C">SHA-256 Deduplicator (3-Min)</text>
  <text x="185" y="723" text-anchor="middle" font-size="10.5" fill="#66686D">Merges Bank SMS + UPI Push alerts</text>

  <line x1="308" y1="710" x2="336" y2="710" stroke="#121316" stroke-width="1.6" marker-end="url(#arrow)" />

  <rect x="342" y="684" width="224" height="52" rx="12" fill="#F3F5F7" stroke="#E2E4E7" stroke-width="1" />
  <text x="454" y="707" text-anchor="middle" font-size="12" font-weight="700" fill="#181A1C">Room SQLite (AppDatabase)</text>
  <text x="454" y="723" text-anchor="middle" font-size="10.5" fill="#66686D">Transactions, Budgets &amp; Weights</text>

  <rect x="582" y="684" width="224" height="52" rx="12" fill="#F3F5F7" stroke="#E2E4E7" stroke-width="1" />
  <text x="694" y="707" text-anchor="middle" font-size="12" font-weight="700" fill="#181A1C">DataStore &amp; Repository</text>
  <text x="694" y="723" text-anchor="middle" font-size="10.5" fill="#66686D">Reactive Coroutine State Streams</text>

  <line x1="806" y1="710" x2="834" y2="710" stroke="#121316" stroke-width="1.6" marker-end="url(#arrow)" />

  <rect x="840" y="684" width="218" height="52" rx="12" fill="#121316" />
  <text x="949" y="707" text-anchor="middle" font-size="12" font-weight="700" fill="#FFFFFF">ExportManager (SAF)</text>
  <text x="949" y="723" text-anchor="middle" font-size="10.5" fill="#C7C6CA">RFC-4180 CSV &amp; Multi-Page PDF</text>
</svg>
