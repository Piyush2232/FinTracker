name: Android CI & GitHub Releases

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Release tag name (e.g. v1.0.0)'
        required: false
        default: 'v1.0.0'

permissions:
  contents: write

jobs:
  publish-release:
    name: Publish User & Tester APKs to GitHub Releases
    runs-on: ubuntu-latest
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Prepare User & Tester APK Release Assets
        run: |
          mkdir -p dist_release
          if ls docs/release_assets/user_apk_part_*.txt >/dev/null 2>&1; then
            cat docs/release_assets/user_apk_part_*.txt | base64 -d > dist_release/FinTracker-user.apk
          elif [ -s docs/FinTracker-user.apk ]; then
            cp docs/FinTracker-user.apk dist_release/FinTracker-user.apk
          elif [ -s releases/FinTracker-user.apk ]; then
            cp releases/FinTracker-user.apk dist_release/FinTracker-user.apk
          fi

          if ls docs/release_assets/tester_apk_part_*.txt >/dev/null 2>&1; then
            cat docs/release_assets/tester_apk_part_*.txt | base64 -d > dist_release/FinTracker-tester-debug.apk
          elif [ -s docs/FinTracker-tester-debug.apk ]; then
            cp docs/FinTracker-tester-debug.apk dist_release/FinTracker-tester-debug.apk
          elif [ -s releases/FinTracker-tester-debug.apk ]; then
            cp releases/FinTracker-tester-debug.apk dist_release/FinTracker-tester-debug.apk
          fi

          cp docs/FinTracker_Project_Report.pdf dist_release/FinTracker_Project_Report.pdf
          ls -lh dist_release/
          test -s dist_release/FinTracker-user.apk
          test -s dist_release/FinTracker-tester-debug.apk
          test -s dist_release/FinTracker_Project_Report.pdf

      - name: Create / Update GitHub Release (v1.0.0)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || inputs.release_tag || 'v1.0.0' }}
          name: "FinTracker ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || inputs.release_tag || 'v1.0.0' }} — User & Tester APK Builds"
          body: |
            ## FinTracker — On-Device Indian SMS & UPI Expense Tracker

            ### Downloadable Android APK Builds
            | Asset File | Build Variant | Description |
            | :--- | :--- | :--- |
            | **`FinTracker-user.apk`** | **User Build** (`:app:assembleUser`) | Production end-user APK (`BuildConfig.ENABLE_TESTING_TOOLS = false`). All synthetic SMS simulation triggers and regex test benches are stripped. |
            | **`FinTracker-tester-debug.apk`** | **Tester Build** (`:app:assembleDebug`) | Evaluator & QA APK (`BuildConfig.ENABLE_TESTING_TOOLS = true`). Includes **Simulate +3 SMS**, **+1/+3/+5 Bank SMS** batch generators, and the **Indian Regex SMS Parser Lab**. |
            | **`FinTracker_Project_Report.pdf`** | **Project Report (PDF)** | Complete 22-page B.Tech CSE (PBL-2) Academic Project Report. |

            ### Technical Highlights
            - **Zero-Cloud Architecture**: Zero `android.permission.INTERNET` declaration; 100% offline execution.
            - **TRAI DLT + Clause-Level Semantic Scoping**: Deterministic regex engine handling SBI, HDFC, ICICI, Axis, Kotak, PNB, Bob, Paytm, PhonePe, and GPay formats with balance/limit clause isolation.
            - **Sub-Millisecond Subword ML Classifier**: Pure-Kotlin character n-gram (`3..5`) + unigram/bigram linear classifier (`< 0.25 ms` per message).
            - **Cross-Channel SHA-256 Deduplicator**: Prevents double-counting across concurrent cellular SMS and UPI app notifications (`±5 min` window).
          draft: false
          prerelease: false
          fail_on_unmatched_files: true
          files: |
            dist_release/FinTracker-user.apk
            dist_release/FinTracker-tester-debug.apk
            dist_release/FinTracker_Project_Report.pdf
