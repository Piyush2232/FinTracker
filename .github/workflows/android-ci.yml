name: Android CI & GitHub Releases

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Optional tag name to publish a GitHub Release (e.g. v1.0.0)'
        required: false
        default: 'v1.0.0'

permissions:
  contents: write

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Run Unit, Regex, ML & Robolectric Tests
        run: ./gradlew :app:testDebugUnitTest

      - name: Assemble User Build (Production UI, Testing Tools Removed)
        run: ./gradlew :app:assembleUser

      - name: Assemble Tester Build (Includes SMS Simulator & Parser Lab)
        run: ./gradlew :app:assembleDebug

      - name: Stage Release-Named APKs
        run: |
          mkdir -p release-apks
          cp app/build/outputs/apk/user/app-user.apk release-apks/FinTracker-user.apk
          cp app/build/outputs/apk/debug/app-debug.apk release-apks/FinTracker-tester-debug.apk

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: FinTracker-APKs
          path: release-apks/*.apk

      - name: Publish to GitHub Releases
        if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || inputs.release_tag }}
          name: "FinTracker ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || inputs.release_tag }}"
          generate_release_notes: true
          files: |
            release-apks/FinTracker-user.apk
            release-apks/FinTracker-tester-debug.apk
