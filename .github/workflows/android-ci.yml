name: Android CI & GitHub Releases

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Release tag name (e.g. v1.0.0)'
        required: false
        default: 'v1.0.0'

permissions:
  contents: write

jobs:
  publish-release:
    name: Publish User & Tester APKs to GitHub Releases
    runs-on: ubuntu-latest
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Create / Update GitHub Release (v1.0.0)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || inputs.release_tag || 'v1.0.0' }}
          name: "FinTracker ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || inputs.release_tag || 'v1.0.0' }} — User & Tester Builds"
          body: |
            ## FinTracker — Privacy-First Indian SMS & UPI Expense Tracker

            ### Included Android Builds
            | APK File | Variant | Description |
            | :--- | :--- | :--- |
            | **`FinTracker-user.apk`** (`12 MB`) | **User Build** | Clean end-user build (`ENABLE_TESTING_TOOLS = false`). All emulator simulation buttons and Parser Lab tools removed. |
            | **`FinTracker-tester-debug.apk`** (`18 MB`) | **Tester Build** | Evaluator & QA build (`ENABLE_TESTING_TOOLS = true`). Includes **Simulate +3 SMS**, **+1/+3/+5 Bank SMS** batch triggers, and the **Indian Regex SMS Parser Lab**. |

            ### Project Report
            - **`FinTracker_Project_Report.pdf`**: Complete 22-page B.Tech CSE PBL-2 Project Report.
          draft: false
          prerelease: false
          files: |
            releases/FinTracker-user.apk
            releases/FinTracker-tester-debug.apk
            docs/FinTracker_Project_Report.pdf

  verify-tests:
    name: Run Unit, Regex, ML & Robolectric Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Execute Unit & Robolectric Test Suite
        run: gradle :app:testDebugUnitTest
